<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم elgoharyX</title>
    <style>
        :root { --primary: #4285F4; --dark: #202124; --light: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-card { background: var(--light); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; width: 100%; max-width: 380px; transition: 0.3s; }
        h2 { color: var(--dark); margin-bottom: 10px; font-size: 24px; }
        p { color: #5f6368; margin-bottom: 30px; font-size: 14px; }
        
        .google-btn { 
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px;
            background: white; cursor: pointer; font-size: 16px; font-weight: 500; color: #3c4043; transition: background 0.2s;
        }
        .google-btn:hover { background: #f7f8f8; border-color: #d2d4d7; }
        .google-icon { width: 20px; height: 20px; }

        #user-profile { display: none; margin-top: 20px; border-top: 1px solid #eee; pt: 20px; }
        .profile-pic { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 15px; }
        .welcome-msg { font-size: 18px; font-weight: bold; color: var(--dark); margin: 5px 0; }
        .user-email { color: #5f6368; font-size: 13px; margin-bottom: 20px; }
        .logout-btn { background: #ea4335; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-card" id="app-card">
    <div id="login-section">
        <h2>elgoharyX</h2>
        <p>قم بتسجيل الدخول للوصول إلى بياناتك</p>
        <button class="google-btn" id="btn-login">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" alt="Google" class="google-icon">
            المتابعة باستخدام حساب جوجل
        </button>
    </div>

    <div id="user-profile">
        <img id="user-img" class="profile-pic" src="" alt="صورة المستخدم">
        <div class="welcome-msg" id="display-name"></div>
        <div class="user-email" id="display-email"></div>
        <button class="logout-btn" id="btn-logout">تسجيل الخروج</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // إعدادات مشروعك commnt-a9855
    const firebaseConfig = {
        apiKey: "AIzaSyDWbNnsm1xpaanEkypEEvjrHHosNj713YY",
        authDomain: "commnt-a9855.firebaseapp.com",
        projectId: "commnt-a9855",
        storageBucket: "commnt-a9855.firebasestorage.app",
        messagingSenderId: "1077378702730",
        appId: "1:1077378702730:web:d0fece55ac909fb7ac3c73"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // 1. منطق تسجيل الدخول
    document.getElementById('btn-login').onclick = async () => {
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            console.error("خطأ أثناء الدخول:", error);
            alert("حدث خطأ: " + error.message);
        }
    };

    // 2. مراقبة حالة المستخدم (هل هو مسجل دخول أم لا)
    onAuthStateChanged(auth, (user) => {
        const loginSection = document.getElementById('login-section');
        const userProfile = document.getElementById('user-profile');

        if (user) {
            // تحديث الواجهة ديناميكياً ببيانات المستخدم
            loginSection.style.display = 'none';
            userProfile.style.display = 'block';
            
            document.getElementById('display-name').innerText = `أهلاً بك، ${user.displayName}`;
            document.getElementById('display-email').innerText = user.email;
            document.getElementById('user-img').src = user.photoURL;
            
            console.log("تم جلب بيانات المستخدم بنجاح:", user.uid);
        } else {
            loginSection.style.display = 'block';
            userProfile.style.display = 'none';
        }
    });

    // 3. منطق تسجيل الخروج
    document.getElementById('btn-logout').onclick = () => {
        signOut(auth).then(() => {
            console.log("تم تسجيل الخروج");
        });
    };
</script>

</body>
</html>
