<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elgoharyX - Advanced Auth</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .section { display: none; margin-top: 20px; padding: 15px; border: 1px solid #eee; border-radius: 10px; }
        .active { display: block; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .google-btn { background: #4285F4; color: white; }
        .verify-btn { background: #34a853; color: white; }
        .phone-btn { background: #fbbc05; color: black; }
        #status { margin-top: 15px; font-size: 14px; color: #d93025; }
    </style>
</head>
<body>

<div class="container">
    <h2>منصة elgoharyX</h2>
    <div id="status"></div>

    <div id="login-section" class="section active">
        <button class="google-btn" id="google-login">المتابعة باستخدام جوجل</button>
    </div>

    <div id="email-verify-section" class="section">
        <p>إيميلك غير مفعل، اضغط لإرسال رابط التحقق:</p>
        <button class="verify-btn" id="send-verify-email">إرسال رابط التحقق للإيميل</button>
        <button onclick="location.reload()">لقد قمت بالتحقق (تحديث)</button>
    </div>

    <div id="phone-section" class="section">
        <p>خطوة أخيرة: أثبت ملكية هاتفك</p>
        <input type="tel" id="phone-number" placeholder="+201234567890">
        <div id="recaptcha-container"></div>
        <button class="phone-btn" id="send-otp">إرسال كود التحقق (SMS)</button>
        
        <div id="otp-input-group" style="display:none;">
            <input type="text" id="otp-code" placeholder="أدخل الكود المكون من 6 أرقام">
            <button class="verify-btn" id="confirm-otp">تأكيد رقم الهاتف</button>
        </div>
    </div>

    <div id="dashboard" class="section">
        <h3 id="user-name"></h3>
        <p style="color: green;">✅ حسابك موثق بالكامل (إيميل وهاتف)</p>
        <button onclick="signOutUser()" style="background:#eee;">خروج</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, sendEmailVerification, onAuthStateChanged, signOut, RecaptchaVerifier, signInWithPhoneNumber, linkWithCredential, PhoneAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDWbNnsm1xpaanEkypEEvjrHHosNj713YY",
        authDomain: "commnt-a9855.firebaseapp.com",
        projectId: "commnt-a9855",
        storageBucket: "commnt-a9855.firebasestorage.app",
        messagingSenderId: "1077378702730",
        appId: "1:1077378702730:web:d0fece55ac909fb7ac3c73"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let confirmationResult;

    // 1. الدخول بجوجل
    document.getElementById('google-login').onclick = async () => {
        try {
            await signInWithPopup(auth, new GoogleAuthProvider());
        } catch (e) { showStatus(e.message); }
    };

    // 2. مراقبة الحالة (المحرك الديناميكي)
    onAuthStateChanged(auth, (user) => {
        hideAllSections();
        if (!user) {
            showSection('login-section');
        } else if (!user.emailVerified) {
            showSection('email-verify-section');
        } else if (!user.phoneNumber) {
            showSection('phone-section');
            setupRecaptcha();
        } else {
            showSection('dashboard');
            document.getElementById('user-name').innerText = "أهلاً " + user.displayName;
        }
    });

    // 3. إرسال إيميل التحقق يدوياً
    document.getElementById('send-verify-email').onclick = async () => {
        try {
            await sendEmailVerification(auth.currentUser);
            showStatus("تم إرسال الرابط! تفقد بريدك.", "green");
        } catch (e) { showStatus(e.message); }
    };

    // 4. نظام التحقق من الهاتف (SMS)
    function setupRecaptcha() {
        if (!window.recaptchaVerifier) {
            window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });
        }
    }

    document.getElementById('send-otp').onclick = async () => {
        const phone = document.getElementById('phone-number').value;
        try {
            confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
            document.getElementById('otp-input-group').style.display = 'block';
            showStatus("تم إرسال الكود هاتفياً", "green");
        } catch (e) { showStatus(e.message); }
    };

    document.getElementById('confirm-otp').onclick = async () => {
        const code = document.getElementById('otp-code').value;
        try {
            // ربط رقم الهاتف بحساب جوجل الحالي
            const credential = PhoneAuthProvider.credential(confirmationResult.verificationId, code);
            await linkWithCredential(auth.currentUser, credential);
            showStatus("تم التوثيق بنجاح!", "green");
        } catch (e) { showStatus("كود خاطئ أو رقم مستخدم مسبقاً"); }
    };

    // وظائف مساعدة
    function showSection(id) { document.getElementById(id).classList.add('active'); }
    function hideAllSections() { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); }
    function showStatus(msg, color = "red") { 
        const s = document.getElementById('status');
        s.innerText = msg; s.style.color = color;
    }
    window.signOutUser = () => signOut(auth);
</script>

</body>
</html>
